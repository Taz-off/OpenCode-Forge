name: release
on:
  push:
    tags: ['v*']
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        shell: pwsh
        run: ./tests/secret-scan.ps1
      - name: Syntax check
        shell: pwsh
        run: ./tests/syntax-check.ps1
      - name: Pack
        shell: pwsh
        run: Compress-Archive -Path bootstrap.ps1,manifest.json,installer,modules,profiles,hardware,templates,commands,skills,README.md,LICENSE,CHANGELOG.md -DestinationPath opencode-forge.zip -Force
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: opencode-forge.zip,bootstrap.ps1,manifest.json
